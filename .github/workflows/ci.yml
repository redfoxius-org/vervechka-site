name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # astro check, build, then scripts/check-site.mjs over dist/
      - run: npm run check
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
